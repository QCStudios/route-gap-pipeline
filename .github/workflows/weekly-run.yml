name: Weekly route gap report

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch CAA data
        working-directory: scripts
        run: python fetch_caa_data.py

      - name: Fetch fare/route signals
        working-directory: scripts
        env:
          FLIGHT_DATA_API_KEY: ${{ secrets.FLIGHT_DATA_API_KEY }}
        run: python fetch_fare_signals.py

      - name: Analyze gaps
        working-directory: scripts
        run: python analyze_gaps.py

      - name: Generate reports
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      - name: Commit new reports
        run: |
          git config user.name "route-gap-bot"
          git config user.email "actions@github.com"
          git add reports/ data/
          git diff --cached --quiet || git commit -m "Weekly route gap report $(date -u +%F)"
          git push
